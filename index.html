<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turn ASCII art into a square 4096 × 4096 PNG, JPEG, or WebP. Choose a font, paste your characters, and download. Everything stays in your browser.">
    <title>ASCII to image</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <main>
        <header>
            <h1>ASCII to image</h1>
            <p>Render ASCII art as a square, 4096 × 4096 image.</p>
        </header>

        <div class="workspace">
            <section class="source" aria-labelledby="source-heading">
                <div class="panel-heading">
                    <h2 id="source-heading"><label for="art">ASCII art</label></h2>
                    <button type="button" class="reset-button" id="example" aria-label="Reset art to flower" title="Reset art to flower">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 12a9 9 0 1 0 9-9c-2.5 0-4.9 1-6.7 2.7L3 8M3 3v5h5" />
                        </svg>
                    </button>
                </div>
                <textarea id="art" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" maxlength="50000" aria-describedby="source-note" placeholder="Paste your ASCII art here…">                       ___ .

        ~__/  \.   ;:.::::::::::_/
               \::.::::::::::::/
                 --_;::::::_-~/
                     """"""</textarea>
                <div class="panel-note">
                    <span id="source-note">Spaces &amp; line breaks stay intact.</span>
                    <output id="stats" aria-label="Art dimensions"></output>
                </div>
                <div class="controls">
                    <label>Typeface
                        <select id="font">
                            <option value="courier">Courier</option>
                            <option value="plex">IBM Plex Mono</option>
                            <option value="space">Space Mono</option>
                        </select>
                    </label>
                    <fieldset id="background">
                        <legend>Background</legend>
                        <div class="swatches">
                            <input type="radio" name="background" value="dark" aria-label="Black" title="Black" checked>
                            <input type="radio" name="background" value="light" aria-label="White" title="White">
                            <input type="radio" name="background" value="transparent" aria-label="Transparent" title="Transparent (PNG or WebP)">
                        </div>
                    </fieldset>
                    <label class="margin-label" for="padding">Margin <output id="padding-value">8%</output>
                        <input type="range" id="padding" min="0" max="24" value="8">
                    </label>
                </div>
            </section>

            <section class="result" aria-labelledby="preview-heading">
                <div class="panel-heading">
                    <h2 id="preview-heading">Preview</h2>
                </div>
                <div class="canvas-wrap">
                    <canvas id="preview" width="1024" height="1024" role="img" aria-label="Live square preview of your ASCII art"></canvas>
                </div>
                <div class="panel-note"><span id="export-info">4096 × 4096 · PNG</span></div>
                <div class="download-controls">
                    <button id="download" type="button" disabled>Download PNG</button>
                    <select id="format" aria-label="Download file type">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                <p id="status" role="status" aria-live="polite"></p>
            </section>
        </div>

        <footer><span>Your art stays in your browser.</span><a href="https://smitp.cc/">smitp.cc</a></footer>
        <noscript><p>Enable JavaScript to preview and download your ASCII art.</p></noscript>
    </main>
</body>
</html>
